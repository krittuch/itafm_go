version: "3"

services:
  kafka:
    image: redpandadata/redpanda:v24.2.9
    container_name: itafm_kafka_dev
    restart: always
    ports:
      - "9092:9092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    volumes:
      - kafka_data_dev:/var/lib/redpanda/data

  java_broker:
    container_name: itafm_amq_kafka_broker_dev
    build:
      context: .
      dockerfile: java-broker/Dockerfile
    restart: always
    env_file:
      - ./.envs/.development/.mqtt
      - ./.envs/.development/.kafka
    depends_on:
      - kafka
    network_mode: host

  gateway:
    container_name: itafm_aods_gw_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    env_file:
      - ./.envs/.development/.postgres
      - ./.envs/.development/.mqtt
      - ./.envs/.development/.kafka
    depends_on:
      - kafka
      - java_broker
    volumes:
      - .:/usr/src/app/
    network_mode: host

volumes:
  kafka_data_dev:
