# Docker Swarm stack itafm_go for the remote development server.
# The dev deploy job (.github/workflows/dev.yml) builds and tags the images
# by commit, then runs:
#   docker stack deploy --resolve-image never -c stack.development.yml itafm_go
# Do not also start these services with `docker compose -f development.yml up`:
# the gateway and broker would consume the same topics twice.
version: "3.8"

x-deploy: &deploy
  replicas: 1
  restart_policy:
    condition: any
    delay: 5s

services:
  aods_archive_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aods_archive
      POSTGRES_USER: aods_archive
      POSTGRES_PASSWORD: aods_archive
    # Host mode: the gateway (host network) and agos_ops' backup stack use
    # 127.0.0.1:5435.
    ports:
      - target: 5432
        published: 5435
        mode: host
    volumes:
      - aods_archive_db_dev:/var/lib/postgresql/data
      - ./compose/aods-archive/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    deploy: *deploy

  itafm_kafka:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9099
    ports:
      - target: 9092
        published: 9099
        mode: host
    volumes:
      - kafka_data_dev:/var/lib/redpanda/data
    deploy: *deploy

  java_broker:
    image: itafm_go-java_broker:${ITAFM_GIT_SHA:?set ITAFM_GIT_SHA}
    env_file:
      - ./.envs/.development/.mqtt
      - ./.envs/.development/.kafka
    networks:
      - hostnet
    deploy: *deploy

  gateway:
    image: itafm_go-gateway:${ITAFM_GIT_SHA:?set ITAFM_GIT_SHA}
    env_file:
      - ./.envs/.development/.postgres
      - ./.envs/.development/.mqtt
      - ./.envs/.development/.kafka
    environment:
      AODS_ARCHIVE_DB_HOST: localhost
      AODS_ARCHIVE_DB_PORT: "5435"
      AODS_ARCHIVE_DB_NAME: aods_archive
      AODS_ARCHIVE_DB_USER: aods_archive
      AODS_ARCHIVE_DB_PASSWORD: aods_archive
    networks:
      - hostnet
    deploy: *deploy

# The volumes the compose project itafm_go created, so the data carries over.
volumes:
  aods_archive_db_dev:
    name: itafm_go_aods_archive_db_dev
    external: true
  kafka_data_dev:
    name: itafm_go_kafka_data_dev
    external: true

networks:
  hostnet:
    name: host
    external: true
