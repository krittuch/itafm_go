name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A push that is the merge of a PR into dev, whose own run of this workflow
  # passed, goes straight to deploy. Same rule as AGOS_DJ's ci.yml.
  classify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip_checks: ${{ steps.merged_pr.outputs.skip_checks }}
    steps:
      - id: merged_pr
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('skip_checks', 'false');
            const {owner, repo} = context.repo;
            const sha = context.sha;
            const before = context.payload.before;
            try {
              const {data: commit} = await github.request(
                'GET /repos/{owner}/{repo}/commits/{commit_sha}',
                {owner, repo, commit_sha: sha}
              );
              // A single merged PR advances dev from its previous tip.
              // Multi-commit pushes and rebases are tested instead.
              if (commit.parents[0]?.sha !== before) return;

              const {data: prs} = await github.request(
                'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                {owner, repo, commit_sha: sha}
              );
              for (const pr of prs) {
                if (!pr.merged_at || pr.base.ref !== 'dev' || pr.merge_commit_sha !== sha) continue;
                const {data} = await github.request(
                  'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                  {owner, repo, workflow_id: 'dev.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 100}
                );
                const runs = data.workflow_runs.filter(run => run.head_branch === pr.head.ref);
                runs.sort((a, b) => b.id - a.id);
                if (runs[0]?.status === 'completed' && runs[0]?.conclusion === 'success') {
                  core.info(`Reusing successful PR #${pr.number} run ${runs[0].id}`);
                  core.setOutput('skip_checks', 'true');
                  return;
                }
              }
              core.info('No successful merged PR run found; running checks on dev.');
            } catch (error) {
              core.warning(`PR lookup failed; running checks on dev: ${error.message}`);
            }

  test:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.skip_checks != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java-broker/pom.xml

      - run: mvn -B -q -DskipTests package
        working-directory: java-broker

  deploy:
    needs: [classify, test]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/dev' &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.classify.outputs.skip_checks == 'true'))
    # Fork PRs never reach this job, so outside code never runs on the dev server.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    # The development environment only allows the dev branch and holds the
    # gateway's secrets.
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      STACK: itafm_go
      ITAFM_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Swarm and the stack's volumes
        run: |
          state=$(docker info --format '{{.Swarm.LocalNodeState}}')
          if [ "$state" != active ]; then
            echo "Swarm is not active on this node (state: $state)" >&2
            exit 1
          fi
          for volume in itafm_go_aods_archive_db_dev itafm_go_kafka_data_dev; do
            docker volume inspect "$volume" >/dev/null
          done

      - name: Build images
        run: |
          timeout --signal=TERM --kill-after=30s 15m \
            docker build -f Dockerfile.dev -t "itafm_go-gateway:${ITAFM_GIT_SHA}" .
          timeout --signal=TERM --kill-after=30s 15m \
            docker build -f java-broker/Dockerfile -t "itafm_go-java_broker:${ITAFM_GIT_SHA}" .

      # .env.example lists the keys; each comes from the development environment
      # secret of the same name. An unset secret falls back to the value in
      # .env.example. Keys with no value there, other than GATEWAY_*, are
      # required.
      - name: Write .env from the development environment
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ACTIVEMQ_BROKER_URL: ${{ secrets.ACTIVEMQ_BROKER_URL }}
          MQTT_IP_ADDRESS: ${{ secrets.MQTT_IP_ADDRESS }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_FLIGHT_MOVEMENT_QUEUE: ${{ secrets.MQTT_FLIGHT_MOVEMENT_QUEUE }}
          MQTT_IDEP_QUEUE: ${{ secrets.MQTT_IDEP_QUEUE }}
          MQTT_SURV_TOPIC: ${{ secrets.MQTT_SURV_TOPIC }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_GROUP_ID: ${{ secrets.KAFKA_GROUP_ID }}
          KAFKA_CLIENT_ID: ${{ secrets.KAFKA_CLIENT_ID }}
          KAFKA_FLIGHT_TOPIC: ${{ secrets.KAFKA_FLIGHT_TOPIC }}
          KAFKA_IDEP_TOPIC: ${{ secrets.KAFKA_IDEP_TOPIC }}
          KAFKA_SURV_TOPIC: ${{ secrets.KAFKA_SURV_TOPIC }}
          SURVEILLANCE_DB_BATCH_INTERVAL: ${{ secrets.SURVEILLANCE_DB_BATCH_INTERVAL }}
          SURVEILLANCE_DB_BATCH_MAX_SIZE: ${{ secrets.SURVEILLANCE_DB_BATCH_MAX_SIZE }}
          GATEWAY_SURVEILLANCE_API_KEYS: ${{ secrets.GATEWAY_SURVEILLANCE_API_KEYS }}
          GATEWAY_MONITOR_USERNAME: ${{ secrets.GATEWAY_MONITOR_USERNAME }}
          GATEWAY_MONITOR_PASSWORD: ${{ secrets.GATEWAY_MONITOR_PASSWORD }}
        run: |
          umask 077
          : > .env
          missing=""
          while IFS=$'\t' read -r key default; do
            value="${!key-}"
            if [ -z "$value" ]; then
              value="$default"
            fi
            if [ -z "$value" ]; then
              case "$key" in
                GATEWAY_*) ;;
                *) missing="$missing $key" ;;
              esac
              continue
            fi
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::secret $key contains a newline" >&2
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> .env
          done < <(awk '/^[A-Z][A-Z0-9_]*=/ { i = index($0, "="); print substr($0, 1, i - 1) "\t" substr($0, i + 1) }' .env.example)
          if [ -n "$missing" ]; then
            echo "::error::Missing development environment secrets:$missing" >&2
            exit 1
          fi

      - name: Remove compose containers (first Swarm deploy only)
        run: |
          # Never add -v: the stack reuses the compose volumes. Skipped once no
          # compose container is left, because the stack's own network is also
          # named itafm_go_default.
          if docker ps -aq --filter label=com.docker.compose.project=itafm_go | grep -q .; then
            docker compose -p itafm_go -f development.yml down --remove-orphans
          fi

      - name: Deploy Swarm stack
        run: |
          timeout --signal=TERM --kill-after=10s 3m \
            docker stack deploy --resolve-image never -c stack.development.yml "$STACK"

      - name: Wait for every service to run its new task
        run: |
          services="aods_archive_db itafm_kafka java_broker gateway"
          for _ in $(seq 1 60); do
            pending=""
            for s in $services; do
              update=$(docker service inspect "${STACK}_${s}" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              case "$update" in
                paused|rollback_*) echo "${STACK}_${s} update $update" >&2
                  docker service ps --no-trunc "${STACK}_${s}" | head -5
                  exit 1 ;;
              esac
              replicas=$(docker service ls --filter "name=${STACK}_${s}" --format '{{.Replicas}}')
              if [ "$replicas" != "1/1" ] || { [ -n "$update" ] && [ "$update" != completed ]; }; then
                pending="$pending ${s}(${replicas:-?} ${update:-new})"
              fi
            done
            if [ -z "$pending" ]; then
              docker stack services "$STACK" --format '{{.Name}} {{.Replicas}} {{.Image}}'
              exit 0
            fi
            sleep 5
          done
          echo "Not ready after 5 minutes:$pending" >&2
          for s in $services; do
            docker service ps --no-trunc --format '{{.Name}} {{.CurrentState}} {{.Error}}' "${STACK}_${s}" | head -3
          done
          exit 1

      # A container left on an older image is what kept the IDEP bay fix off dev.
      - name: Check gateway and broker run this commit
        run: |
          for s in gateway java_broker; do
            image=$(docker service inspect "${STACK}_${s}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            if [ "${image%%@*}" != "itafm_go-${s}:${ITAFM_GIT_SHA}" ]; then
              echo "${STACK}_${s} runs $image, expected itafm_go-${s}:${ITAFM_GIT_SHA}" >&2
              exit 1
            fi
          done

      - name: Wait for monitors
        run: |
          for url in http://127.0.0.1:18081/health http://127.0.0.1:18080/health; do
            for _ in $(seq 1 36); do
              curl -fsS --max-time 5 "$url" && echo && continue 2
              sleep 5
            done
            echo "$url not healthy after 3 minutes" >&2
            docker service logs --no-task-ids --tail 100 "${STACK}_gateway"
            docker service logs --no-task-ids --tail 100 "${STACK}_java_broker"
            exit 1
          done

      - name: Remove old image tags
        run: |
          # Keep this commit's tag and the 2 newest others for rollback. The
          # current tag is excluded by name: a rebuild with no change shares the
          # old image's creation time, and Swarm needs the tag to restart a task.
          for repo in itafm_go-gateway itafm_go-java_broker; do
            docker image ls "$repo" --format '{{.CreatedAt}}\t{{.Tag}}' \
              | awk -F'\t' -v cur="$ITAFM_GIT_SHA" '$2 != cur' \
              | sort -r | tail -n +3 | cut -f2 \
              | sed "s|^|$repo:|" | xargs -r docker image rm || true
          done

      - name: Remove .env
        if: always()
        run: rm -f .env
