services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: itafm_kafka_prod
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data_prod:/bitnami/kafka

  java_broker:
    container_name: itafm_amq_kafka_broker_prod
    build:
      context: .
      dockerfile: java-broker/Dockerfile
    restart: always
    env_file:
      - ./.envs/.production/.mqtt
      - ./.envs/.production/.kafka
    depends_on:
      - kafka
    network_mode: host

  gateway:
    container_name: itafm_aods_gw_prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./.envs/.production/.postgres
      - ./.envs/.production/.mqtt
      - ./.envs/.production/.kafka
    depends_on:
      - kafka
      - java_broker
    volumes:
      - .:/usr/src/app/
    network_mode: host

  restarter:
    image: docker:cli
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +'%H:%M')" = '17:00' ]; then
            docker restart gateway
          fi
          sleep 60
        done

volumes:
  kafka_data_prod:
