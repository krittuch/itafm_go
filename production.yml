services:
  aods_archive_db:
    image: postgres:16-alpine
    container_name: itafm_aods_archive_db_prod
    restart: always
    environment:
      POSTGRES_DB: aods_archive
      POSTGRES_USER: aods_archive
      POSTGRES_PASSWORD: aods_archive
    ports:
      - "5436:5432"
    volumes:
      - aods_archive_db_prod:/var/lib/postgresql/data
      - ./compose/aods-archive/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  itafm_kafka:
    image: redpandadata/redpanda:v24.2.9
    container_name: itafm_kafka
    restart: always
    ports:
      - "9099:9092"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9099
    volumes:
      - kafka_data_prod:/var/lib/redpanda/data

  java_broker:
    container_name: itafm_amq_kafka_broker_prod
    build:
      context: .
      dockerfile: java-broker/Dockerfile
    restart: always
    env_file:
      - ./.envs/.production/.mqtt
      - ./.envs/.production/.kafka
    depends_on:
      - itafm_kafka
    network_mode: host

  gateway:
    container_name: itafm_aods_gw_prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./.envs/.production/.postgres
      - ./.envs/.production/.mqtt
      - ./.envs/.production/.kafka
    environment:
      AODS_ARCHIVE_DB_HOST: localhost
      AODS_ARCHIVE_DB_PORT: "5436"
      AODS_ARCHIVE_DB_NAME: aods_archive
      AODS_ARCHIVE_DB_USER: aods_archive
      AODS_ARCHIVE_DB_PASSWORD: aods_archive
    depends_on:
      - aods_archive_db
      - itafm_kafka
      - java_broker
    volumes:
      - .:/usr/src/app/
    network_mode: host

  restarter:
    image: docker:cli
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +'%H:%M')" = '17:00' ]; then
            docker restart gateway
          fi
          sleep 60
        done

volumes:
  aods_archive_db_prod:
  kafka_data_prod:
